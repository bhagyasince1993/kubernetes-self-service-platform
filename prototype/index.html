<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux Kubernetes | Self-Service Portal Prototype</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14233d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.sidebar{width:248px;background:#111d34;color:#dbe7fa;padding:27px 17px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:10px}.logo{width:35px;height:35px;border-radius:10px;background:#647bff;display:grid;place-items:center;color:white}.subtitle{font-size:11px;color:#93a5c4;margin:0 0 35px 45px}.nav{width:100%;background:transparent;color:#adbfda;border:0;text-align:left;border-radius:10px;padding:13px 12px;margin:3px 0;display:flex;align-items:center;gap:11px}.nav.active,.nav:hover{background:#273c61;color:white}.nav .sym{width:21px;text-align:center}.foot{position:absolute;bottom:24px;left:19px;right:19px;font-size:12px;color:#91a4c6;line-height:1.7;border-top:1px solid #34435d;padding-top:16px}.main{flex:1;min-width:0}.top{height:74px;background:white;border-bottom:1px solid #e6ebf3;display:flex;align-items:center;justify-content:space-between;padding:0 34px}.pill{background:#e8f8f1;color:#087a4b;border-radius:100px;padding:7px 12px;font-size:12px;font-weight:700}.avatar{border-radius:50%;width:35px;height:35px;background:#e9eefe;display:grid;place-items:center;color:#4157ba;font-weight:800}.topright{display:flex;gap:16px;align-items:center}.content{padding:32px 36px;max-width:1280px;margin:auto}.eyebrow{font-size:12px;color:#647bff;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.h1{font-size:30px;letter-spacing:-.04em;margin:7px 0 8px}.muted{color:#74849e;font-size:14px;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}.card,.panel{background:#fff;border:1px solid #e4eaf3;border-radius:15px;box-shadow:0 6px 24px #213b6310}.card{padding:21px}.metric{font-size:30px;font-weight:800;margin:11px 0 4px}.small{font-size:12px;color:#71839e}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.btn{border:0;background:#5367ec;color:white;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:750}.btn:hover{background:#3d50d1}.btn.secondary{background:#edf1fd;color:#4259be}.btn.danger{background:#fff0f1;color:#bd4053}.panel{padding:23px;margin-top:20px}.panel h2{font-size:17px;margin:0 0 18px}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.gridform{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field label{font-size:12px;font-weight:750;color:#40516d}.field input,.field select{border:1px solid #dce4ef;border-radius:9px;padding:12px;color:#243653;background:#fff;min-width:0}.field input:focus,.field select:focus{outline:2px solid #b8c3ff;border-color:#6577f4}.help{font-size:11px;color:#8290a5}.tag{font-size:11px;padding:5px 9px;border-radius:20px;font-weight:750;background:#e9f8f1;color:#16845d;white-space:nowrap}.tag.blue{background:#eaf0ff;color:#4865c7}.tag.orange{background:#fff3e2;color:#b77b1e}.tag.gray{background:#f0f3f7;color:#758397}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:#8490a3;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #edf0f5;padding:13px 10px}td{padding:16px 10px;border-bottom:1px solid #f0f3f8}tr:last-child td{border:0}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.progress{height:8px;border-radius:9px;background:#e9edf5;overflow:hidden;flex:1}.progress>span{height:100%;display:block;background:#5367ec;border-radius:9px;transition:width .25s}.barrow{display:flex;align-items:center;gap:12px;margin:14px 0}.barrow b{min-width:105px;font-size:12px}.barrow .num{min-width:36px;text-align:right;font-weight:800}.note{padding:13px 16px;border:1px solid #dce5ff;background:#f1f5ff;border-radius:10px;color:#4b5d91;font-size:12px;line-height:1.6;margin:17px 0}.success{border-color:#c5ebd8;background:#f0fbf5;color:#157c4b}.error{border-color:#ffd1d5;background:#fff4f4;color:#b03e4e}.empty{padding:40px;text-align:center;color:#8390a5}.step{display:flex;gap:12px;align-items:center;margin:13px 0;font-size:13px}.dot{width:24px;height:24px;border-radius:50%;background:#e8edfb;display:grid;place-items:center;color:#5066cc;font-size:11px;font-weight:800}.step.done .dot{background:#dff7e9;color:#12814e}.hidden{display:none!important}.mock{border:1px solid #e1e8f5;background:linear-gradient(145deg,#f6f9ff,#fff);border-radius:13px;padding:18px}.seg{display:flex;gap:6px;background:#edf1f8;padding:5px;border-radius:10px;width:max-content}.seg button{background:transparent;color:#74829a;border:0;border-radius:7px;padding:8px 14px}.seg button.active{background:white;color:#4059cc;box-shadow:0 1px 4px #0001}.toast{position:fixed;bottom:24px;right:24px;background:#182944;color:white;padding:15px 20px;border-radius:11px;box-shadow:0 12px 40px #12203844;z-index:10;max-width:350px;font-size:13px}.kicker{font-size:12px;font-weight:700;color:#6c7c99;margin-bottom:6px}@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.sidebar{width:74px;padding:23px 10px}.brand span,.subtitle,.nav .label,.foot{display:none}.brand{justify-content:center}.nav{justify-content:center}.top{padding:0 18px}.content{padding:24px 18px}}@media(max-width:600px){.cards,.gridform{grid-template-columns:1fr}.sidebar{width:56px;padding:15px 5px}.brand{font-size:13px}.logo{width:32px;height:32px}.content{padding:17px 11px}.h1{font-size:25px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">⬡</div><span>KubeLaunch</span></div><p class="subtitle">LINUX SELF-SERVICE PORTAL</p><nav id="nav"></nav><div class="foot">● Prototype environment<br>Local simulation · No live cluster access</div></aside><div class="main"><header class="top"><div style="font-weight:750;font-size:14px">Workspace <span style="color:#9eabc1">/</span> <span id="crumb">Overview</span></div><div class="topright"><span class="pill">● Demo Mode</span><span class="avatar">BD</span></div></header><main class="content" id="app"></main></div></div><div id="toast" class="toast hidden"></div><script>
const initial={clusters:[{name:'vmware-lab',provider:'Local kind',version:'v1.35.0',nodes:1,status:'Ready',created:'Demo baseline'},{name:'vmware-test',provider:'Local kind',version:'v1.35.0',nodes:1,status:'Ready',created:'Demo baseline'}],deployments:[{name:'nginx-demo',namespace:'self-service',cluster:'vmware-lab',image:'nginx:stable',replicas:4,status:'Healthy',version:1}],history:[{id:1,time:'Demo baseline',action:'Scale workload',resource:'nginx-demo',detail:'3 → 4 replicas (previously observed)',status:'Success'},{id:2,time:'Demo baseline',action:'Deploy workload',resource:'nginx-demo',detail:'NGINX Linux deployment (previously observed)',status:'Success'},{id:3,time:'Demo baseline',action:'Provision cluster',resource:'vmware-test',detail:'Local kind cluster (previously observed)',status:'Success'}]};
let state=JSON.parse(JSON.stringify(initial)),page='overview',notice='',historyFilter='All';const nav=[['overview','▦','Overview'],['clusters','⬡','Cluster Requests'],['deploy','◈','Linux Deployment'],['scale','↗','Scaling'],['upgrade','⇧','Upgrades'],['history','◷','Deployment History']];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tag=(s)=>`<span class="tag ${s==='Success'||s==='Ready'||s==='Healthy'?'':s==='Failed'?'orange':'blue'}">${esc(s)}</span>`;function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500)}function record(action,resource,detail,status='Success'){state.history.unshift({id:Date.now(),time:new Date().toLocaleString(),action,resource,detail,status})}function go(p){page=p;render();window.scrollTo(0,0)}function navrender(){document.getElementById('nav').innerHTML=nav.map(([id,icon,label])=>`<button class="nav ${page===id?'active':''}" onclick="go('${id}')"><span class="sym">${icon}</span><span class="label">${label}</span></button>`).join('');document.getElementById('crumb').textContent=nav.find(n=>n[0]===page)[2]};function head(k,t,d){return `<div class="eyebrow">${k}</div><h1 class="h1">${t}</h1><p class="muted">${d}</p>`};function clusterOptions(){return state.clusters.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('')}function deployOptions(){return state.deployments.map(d=>`<option value="${esc(d.name)}">${esc(d.name)} · ${esc(d.cluster)}</option>`).join('')};function overview(){return head('Developer workspace','Infrastructure at a glance','Request environments and manage Linux workloads from one place.')+`<div class="cards"><div class="card"><div class="small">Total clusters</div><div class="metric">${state.clusters.length}</div><div class="small">Demo environments</div></div><div class="card"><div class="small">Active deployments</div><div class="metric">${state.deployments.length}</div><div class="small">Linux workloads</div></div><div class="card"><div class="small">Desired replicas</div><div class="metric">${state.deployments.reduce((a,d)=>a+d.replicas,0)}</div><div class="small">Across deployments</div></div><div class="card"><div class="small">Recorded events</div><div class="metric">${state.history.length}</div><div class="small">Baseline + demo actions</div></div></div><div class="grid2"><section class="panel"><div class="row space"><h2>Cluster environments</h2><button class="btn secondary" onclick="go('clusters')">Request cluster →</button></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Provider</th><th>Nodes</th><th>Status</th></tr></thead><tbody>${state.clusters.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.provider)}</td><td>${c.nodes}</td><td>${tag(c.status)}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><h2>Quick actions</h2><div class="mock"><p style="margin:0 0 10px;font-weight:800">Launch your next Linux workload</p><p class="muted">Select a cluster, choose an image, and deploy using the guided workflow.</p><button class="btn" onclick="go('deploy')">+ New deployment</button></div><div class="note">This clickable prototype simulates requests locally. It does not execute kubectl or provision real VMware infrastructure.</div></section></div><section class="panel"><div class="row space"><h2>Recent activity</h2><button class="btn secondary" onclick="go('history')">View history →</button></div>${historyTable(state.history.slice(0,4))}</section>`}function clusters(){return head('Infrastructure / 01','Cluster requests','Provision a standard Linux Kubernetes environment using a guided request form.')+`<div class="grid2"><section class="panel"><h2>Request a cluster</h2><form id="clusterForm" onsubmit="return createCluster(event)"><div class="field"><label>Cluster name</label><input required id="clusterName" placeholder="e.g. linux-dev-01" pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?" maxlength="40"><span class="help">Lowercase letters, numbers and hyphens</span></div><div class="gridform"><div class="field"><label>Environment</label><select id="clusterEnv"><option>Development</option><option>Testing</option><option>Staging</option></select></div><div class="field"><label>Kubernetes version</label><select id="clusterVersion"><option>v1.35.0 (demo)</option><option>v1.34.x (sample)</option></select></div></div><div class="gridform"><div class="field"><label>Worker nodes</label><select id="clusterNodes"><option value="1">1 node</option><option value="2">2 nodes</option><option value="3">3 nodes</option></select></div><div class="field"><label>Infrastructure</label><select id="clusterProvider"><option>Local kind (simulation)</option><option disabled>VMware Tanzu (future integration)</option></select></div></div><div class="note">Demo only: requests update the prototype state. No actual Kubernetes cluster is created.</div><button class="btn" type="submit">+ Submit cluster request</button></form></section><section class="panel"><h2>Provisioning workflow</h2>${['Validate request','Apply approved configuration','Provision Kubernetes cluster','Verify node readiness','Record deployment event'].map((s,i)=>`<div class="step"><span class="dot">${i+1}</span><span>${s}</span></div>`).join('')}<div class="mock" style="margin-top:22px"><b>Template: Linux development</b><p class="muted">Standardized configuration · Repeatable setup · Readiness verification</p>${tag('Proposed enterprise workflow')}</div></section></div><section class="panel"><h2>Cluster inventory</h2><div class="tablewrap"><table><thead><tr><th>Cluster</th><th>Provider</th><th>Version</th><th>Nodes</th><th>Status</th></tr></thead><tbody>${state.clusters.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.provider)}</td><td>${esc(c.version)}</td><td>${c.nodes}</td><td>${tag(c.status)}</td></tr>`).join('')}</tbody></table></div></section>`}function createCluster(e){e.preventDefault();let n=document.getElementById('clusterName').value.trim();if(state.clusters.some(c=>c.name===n)){toast('That cluster name already exists');return false}let nodes=+document.getElementById('clusterNodes').value;state.clusters.push({name:n,provider:'Local kind · simulated',version:document.getElementById('clusterVersion').value.split(' ')[0],nodes,status:'Ready',created:new Date().toLocaleString()});record('Cluster request',n,`${nodes} node(s) · simulated`);render();toast(`Demo cluster ${n} added`);return false}function deploy(){return head('Workloads / 02','Deploy Linux application','Use a guided form to simulate a repeatable Kubernetes deployment.')+`<div class="grid2"><section class="panel"><h2>New deployment</h2><form onsubmit="return createDeploy(event)"><div class="gridform"><div class="field"><label>Target cluster</label><select id="depCluster">${clusterOptions()}</select></div><div class="field"><label>Namespace</label><input id="depNamespace" required value="self-service" pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?"></div></div><div class="field"><label>Application name</label><input id="depName" required placeholder="e.g. nginx-web" pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?"></div><div class="field"><label>Container image</label><select id="depImage"><option>nginx:stable</option><option>nginx:1.28</option><option>httpd:2.4</option><option>redis:7</option></select></div><div class="field"><label>Initial replicas</label><input id="depReplicas" type="number" min="1" max="10" value="3" required></div><div class="note">Only predefined demo images are selectable. A real platform would validate registry access, security policies and resource quotas.</div><button class="btn" type="submit">◈ Deploy application</button></form></section><section class="panel"><h2>Deployment preview</h2><div class="mock"><div class="kicker">SIMULATED KUBERNETES WORKFLOW</div><pre class="mono" style="line-height:1.9;white-space:pre-wrap">1. Validate image and namespace
2. Generate deployment manifest
3. Apply to selected cluster
4. Wait for Pod readiness
5. Record release history</pre></div><div class="note success">Baseline example: nginx-demo was previously tested locally with 3/3 replicas, then scaled to 4/4.</div></section></div><section class="panel"><h2>Workload inventory</h2>${deploymentTable()}</section>`}function createDeploy(e){e.preventDefault();let n=document.getElementById('depName').value.trim(),c=document.getElementById('depCluster').value;if(state.deployments.some(d=>d.name===n&&d.cluster===c)){toast('Deployment already exists in this cluster');return false}let d={name:n,namespace:document.getElementById('depNamespace').value,cluster:c,image:document.getElementById('depImage').value,replicas:+document.getElementById('depReplicas').value,status:'Healthy',version:1};state.deployments.push(d);record('Deploy workload',n,`${d.image} · ${d.replicas} replicas · simulated`);render();toast(`Demo deployment ${n} created`);return false}function deploymentTable(){return `<div class="tablewrap"><table><thead><tr><th>Application</th><th>Cluster</th><th>Image</th><th>Replicas</th><th>Status</th></tr></thead><tbody>${state.deployments.map(d=>`<tr><td><b>${esc(d.name)}</b><div class="small">${esc(d.namespace)}</div></td><td>${esc(d.cluster)}</td><td class="mono">${esc(d.image)}</td><td>${d.replicas}/${d.replicas}</td><td>${tag(d.status)}</td></tr>`).join('')}</tbody></table></div>`}function scale(){return head('Workloads / 03','Scale workloads','Adjust replica counts and inspect simulated capacity changes.')+`<div class="grid2"><section class="panel"><h2>Scale deployment</h2><form onsubmit="return doScale(event)"><div class="field"><label>Select workload</label><select id="scaleTarget" onchange="updateScalePreview()">${deployOptions()}</select></div><div class="field"><label>Desired replicas</label><input id="scaleCount" type="number" min="1" max="20" value="5" oninput="updateScalePreview()" required></div><div class="note">Changes in this prototype are immediate simulations. A live platform would wait for the Kubernetes rollout and check resource capacity.</div><button class="btn" type="submit">↗ Apply scaling</button></form></section><section class="panel"><h2>Capacity preview</h2><div id="scalePreview"></div></section></div><section class="panel"><h2>Deployment capacity</h2>${state.deployments.map(d=>`<div class="barrow"><b>${esc(d.name)}</b><div class="progress"><span style="width:${Math.min(100,d.replicas/20*100)}%"></span></div><span class="num">${d.replicas}</span></div>`).join('')}</section>`}function updateScalePreview(){let s=document.getElementById('scaleTarget'),d=state.deployments.find(d=>d.name===s?.value),n=+document.getElementById('scaleCount')?.value||0,p=document.getElementById('scalePreview');if(!p||!d)return;p.innerHTML=`<div class="row space"><div><div class="small">Current</div><div class="metric">${d.replicas}</div></div><div style="font-size:25px;color:#7486e8">→</div><div><div class="small">Requested</div><div class="metric">${n}</div></div></div><div class="barrow"><div class="progress"><span style="width:${Math.min(100,n/20*100)}%"></span></div></div><p class="muted">${n>d.replicas?`Scale out by ${n-d.replicas} replica(s)`:(n<d.replicas?`Scale in by ${d.replicas-n} replica(s)`:'No change')}</p>`}function doScale(e){e.preventDefault();let d=state.deployments.find(d=>d.name===document.getElementById('scaleTarget').value),n=+document.getElementById('scaleCount').value;if(!d||n<1||n>20)return false;let old=d.replicas;d.replicas=n;record('Scale workload',d.name,`${old} → ${n} replicas · simulated`);render();toast(`Demo scaled ${d.name}: ${old} → ${n}`);return false}function upgrade(){return head('Release management / 04','Rolling upgrades','Preview a controlled application upgrade and simulate success or rollback.')+`<div class="grid2"><section class="panel"><h2>New upgrade</h2><form onsubmit="return doUpgrade(event)"><div class="field"><label>Workload</label><select id="upTarget" onchange="updateUpPreview()">${deployOptions()}</select></div><div class="field"><label>Target image</label><select id="upImage" onchange="updateUpPreview()"><option>nginx:1.28</option><option>nginx:stable</option><option>nginx:invalid-test-tag</option><option>httpd:2.4</option><option>redis:7</option></select></div><div class="field"><label>Release strategy</label><select><option>Rolling update</option></select></div><div class="note">Select <b>nginx:invalid-test-tag</b> to simulate a failed rollout and rollback. This does not execute a real upgrade.</div><button class="btn" type="submit">⇧ Start demo upgrade</button></form></section><section class="panel"><h2>Upgrade preview</h2><div id="upPreview"></div><div class="mock"><div class="kicker">PROPOSED RELEASE GUARDRAILS</div>${['Validate target image','Start rolling rollout','Check readiness and timeout','Rollback on failure','Record release outcome'].map((s,i)=>`<div class="step"><span class="dot">${i+1}</span>${s}</div>`).join('')}</div></section></div><section class="panel"><h2>Current workload versions</h2>${deploymentTable()}</section>`}function updateUpPreview(){let d=state.deployments.find(d=>d.name===document.getElementById('upTarget')?.value),p=document.getElementById('upPreview');if(d&&p)p.innerHTML=`<div class="small">Current image</div><div class="mono" style="font-size:17px;font-weight:800;margin:9px 0 15px">${esc(d.image)}</div><div class="small">Deployment</div><p style="font-weight:750">${esc(d.name)} · ${esc(d.cluster)}</p>`}function doUpgrade(e){e.preventDefault();let d=state.deployments.find(d=>d.name===document.getElementById('upTarget').value),target=document.getElementById('upImage').value,old=d.image;if(target.includes('invalid')){record('Upgrade + rollback',d.name,`${target} failed; previous ${old} retained · simulated`,'Failed');render();toast(`Demo failed upgrade; ${old} retained`)}else{d.image=target;d.version++;record('Rolling upgrade',d.name,`${old} → ${target} · simulated`);render();toast(`Demo upgrade completed: ${target}`)}return false}function historyTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Time</th><th>Action</th><th>Resource</th><th>Details</th><th>Result</th></tr></thead><tbody>${rows.length?rows.map(h=>`<tr><td class="small">${esc(h.time)}</td><td><b>${esc(h.action)}</b></td><td class="mono">${esc(h.resource)}</td><td>${esc(h.detail)}</td><td>${tag(h.status)}</td></tr>`).join(''):`<tr><td colspan="5" class="empty">No matching events</td></tr>`}</tbody></table></div>`}function history(){let actions=['All',...new Set(state.history.map(h=>h.action))],rows=historyFilter==='All'?state.history:state.history.filter(h=>h.action===historyFilter);return head('Audit trail / 05','Deployment history','Review baseline examples and actions performed during this prototype session.')+`<section class="panel"><div class="row space"><h2>Activity log</h2><div class="row"><select id="historyFilter" onchange="historyFilter=this.value;render()" style="padding:10px;border:1px solid #dce4ef;border-radius:8px">${actions.map(a=>`<option ${historyFilter===a?'selected':''}>${esc(a)}</option>`).join('')}</select><button class="btn secondary" onclick="exportHistory()">↓ Export CSV</button></div></div>${historyTable(rows)}<div class="note">Demo history is stored only in this page session. Baseline entries summarize previously observed local tests; newly generated entries are simulations.</div><button class="btn danger" onclick="resetDemo()">Reset demo data</button></section>`}function exportHistory(){let rows=[['Time','Action','Resource','Details','Result'],...state.history.map(h=>[h.time,h.action,h.resource,h.detail,h.status])],csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='kubernetes-demo-history.csv';a.click();URL.revokeObjectURL(a.href);toast('Demo history exported')}function resetDemo(){if(!confirm('Reset all simulated clusters, workloads and events?'))return;state=JSON.parse(JSON.stringify(initial));historyFilter='All';go('overview');toast('Demo reset to baseline')}function render(){navrender();document.getElementById('app').innerHTML=({overview,clusters,deploy,scale,upgrade,history}[page])();if(page==='scale')updateScalePreview();if(page==='upgrade')updateUpPreview()}render();
</script></body></html>
